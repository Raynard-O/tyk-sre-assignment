name: Build image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_DIR: golang
  DOCKERFILE: golang/Dockerfile

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: golang

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_DIR }}/go.mod

      - run: go vet ./...

      - run: go test -race -count=1 ./...

  integration:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: golang

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_DIR }}/go.mod

      - uses: helm/kind-action@v1
        with:
          cluster_name: sre-assignment

      - run: TEST_KUBECONFIG="$HOME/.kube/config" go test -tags=integration -count=1 ./test/...

  build:
    needs: [test, integration]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}


      - uses: docker/build-push-action@v6
        with:
          context: ./${{ env.GO_DIR }}
          file: ./${{ env.DOCKERFILE }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint and render charts
        run: |
          set -euo pipefail

          charts=$(find . -name Chart.yaml -exec dirname {} \; | sort)

          if [ -z "$charts" ]; then
            echo "::error::no Chart.yaml found"
            exit 1
          fi

          for chart in $charts; do
            helm lint "$chart"
            helm template release-name "$chart" > /dev/null
          done